name: Apply CLI runtime boundary

on:
  push:
    branches:
      - fix/vercel-sharp-exports-resolution
    paths:
      - scripts/apply-cli-runtime-boundary.mjs
      - .github/workflows/apply-cli-runtime-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-sharp-exports-resolution
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply CLI runtime boundary patch
        run: node scripts/apply-cli-runtime-boundary.mjs

      - name: Add regression test
        run: |
          cat > tests/cli-runtime-boundary.test.ts <<'EOF'
          import { readFile } from "node:fs/promises";
          import path from "node:path";
          import { describe, expect, it } from "vitest";

          const root = process.cwd();

          describe("CLI runtime boundary", () => {
            it("keeps CLI execution in bin.ts instead of cli.ts", async () => {
              const [binSource, cliSource, nodeSource] = await Promise.all([
                readFile(path.join(root, "src", "bin.ts"), "utf8"),
                readFile(path.join(root, "src", "cli.ts"), "utf8"),
                readFile(path.join(root, "src", "node.ts"), "utf8"),
              ]);

              expect(binSource).toContain("runResuxCli(process.argv.slice(2))");
              expect(cliSource).not.toContain("if (isMainModule())");
              expect(nodeSource).toContain('from "./cli.js"');
            });

            it("executes internal CLI checks through dist/bin.js", async () => {
              const [deploySource, packageSource] = await Promise.all([
                readFile(path.join(root, "scripts", "verify-deploy-targets.mjs"), "utf8"),
                readFile(path.join(root, "package.json"), "utf8"),
              ]);
              expect(deploySource).toContain('path.join(rootDir, "dist", "bin.js")');
              expect(packageSource).toContain("node dist/bin.js init");
            });
          });
          EOF

      - name: Commit boundary fix and remove temporary patch files
        run: |
          set -euo pipefail
          rm scripts/apply-cli-runtime-boundary.mjs
          rm .github/workflows/apply-cli-runtime-boundary.yml
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add src/cli.ts scripts/verify-deploy-targets.mjs package.json tests/cli-runtime-boundary.test.ts scripts/apply-cli-runtime-boundary.mjs .github/workflows/apply-cli-runtime-boundary.yml
          git commit -m "fix(runtime): separate CLI execution from server entry"
          git push origin HEAD:fix/vercel-sharp-exports-resolution
