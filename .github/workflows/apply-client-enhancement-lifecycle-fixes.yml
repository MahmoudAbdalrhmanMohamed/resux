name: Apply client enhancement lifecycle fixes

on:
  push:
    branches:
      - perf/client-enhancement-lifecycle

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/client-enhancement-lifecycle
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Synchronize lockfile metadata for verification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.name = pkg.name;
          lock.version = pkg.version;
          lock.packages[''].name = pkg.name;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify Rolldown Linux native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Apply framework fixes
        run: node scripts/apply-client-enhancement-lifecycle-fixes.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Run all tests
        run: npm test

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- package-lock.json
          rm scripts/apply-client-enhancement-lifecycle-fixes.mjs
          rm .github/workflows/apply-client-enhancement-lifecycle-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(runtime): share enhancement scheduling and cleanup"
          git push origin HEAD:perf/client-enhancement-lifecycle
