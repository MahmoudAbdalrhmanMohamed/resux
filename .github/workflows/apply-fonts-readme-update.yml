name: Apply Fonts README update

on:
  push:
    branches:
      - docs/update-fonts-readme

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/update-fonts-readme
          fetch-depth: 0

      - name: Update README
        run: python .github/scripts/update-fonts-readme.py

      - name: Commit README update
        run: |
          rm .github/workflows/apply-fonts-readme-update.yml
          rm .github/scripts/update-fonts-readme.py
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add README.md .github/workflows/apply-fonts-readme-update.yml .github/scripts/update-fonts-readme.py
          git commit -m "docs(fonts): refresh README loading strategy"
          git push origin HEAD:docs/update-fonts-readme
