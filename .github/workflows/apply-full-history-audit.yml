name: Apply full history audit fixes

on:
  push:
    branches:
      - audit/full-history-correctness

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply and verify audit fixes
        id: verify
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Apply source transforms'
            node scripts/apply-history-security-fixes.mjs
            echo '## Typecheck'
            npm run typecheck
            echo '## Full tests'
            npm test
          } 2>&1 | tee full-history-audit-verification.log

      - name: Commit verified fixes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm full-history-audit-verification.log
          rm scripts/apply-history-security-fixes.mjs
          rm .github/workflows/apply-full-history-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden historical framework regressions"
          git push origin HEAD:audit/full-history-correctness

      - name: Commit verification diagnostics
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp full-history-audit-verification.log /tmp/full-history-audit-verification.log
          git reset --hard HEAD
          cp /tmp/full-history-audit-verification.log full-history-audit-verification.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-history-audit-verification.log
          git commit -m "test: record full history audit verification failure"
          git push origin HEAD:audit/full-history-correctness
