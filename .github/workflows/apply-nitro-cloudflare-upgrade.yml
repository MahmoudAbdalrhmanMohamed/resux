name: Apply Nitro Cloudflare compatibility upgrade

on:
  push:
    branches:
      - fix/vercel-sharp-exports-resolution
    paths:
      - .github/workflows/apply-nitro-cloudflare-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-sharp-exports-resolution
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Upgrade Nitro within supported Node range
        run: npm install nitropack@~2.13.1 --save-exact=false --no-audit --no-fund
      - name: Commit dependency update and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/apply-nitro-cloudflare-upgrade.yml
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add package.json package-lock.json .github/workflows/apply-nitro-cloudflare-upgrade.yml
          git commit -m "fix(cloudflare): upgrade Nitro compatibility layer"
          git push origin HEAD:fix/vercel-sharp-exports-resolution
