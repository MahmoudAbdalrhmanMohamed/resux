name: Apply resume event delegation patch

on:
  push:
    branches:
      - perf/resume-on-demand-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/runtime/index.ts')
          source = path.read_text()
          pattern = re.compile(
              r'  for \(const eventName of \["input", "change", "submit", "keydown", "keyup", "keypress", "mousedown", "mouseup", "blur", "focusout"\]\) \{\n'
              r'    registerDelegatedEvent\(eventName, false\);\n'
              r'  \}\n'
              r'  for \(const eventName of \["load", "error", "loadstart", "loadedmetadata", "loadeddata", "canplay", "lazy-load-start", "lazy-load-complete"\]\) \{\n'
              r'    registerDelegatedEvent\(eventName, true\);\n'
              r'  \}\n'
              r'  registerDelegatedEventsFromDom\(document\);\n'
          )
          updated, count = pattern.subn('  registerDelegatedEventsFromDom(document);\n', source, count=1)
          if count != 1:
              raise SystemExit(f'expected one eager delegated-event block, found {count}')
          path.write_text(updated)
          PY
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- src/runtime/index.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts
          git commit -m "perf(runtime): register resumable events on demand"
          git push
