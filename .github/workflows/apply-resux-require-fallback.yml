name: Apply framework resolver fallback

on:
  push:
    branches:
      - fix/vercel-sharp-exports-resolution
    paths:
      - scripts/apply-resux-require-fallback.mjs
      - .github/workflows/apply-resux-require-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-sharp-exports-resolution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply framework resolver fallback
        run: node scripts/apply-resux-require-fallback.mjs

      - name: Commit fallback and remove temporary patch files
        run: |
          set -euo pipefail
          rm scripts/apply-resux-require-fallback.mjs
          rm .github/workflows/apply-resux-require-fallback.yml
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add src/deploy/vercel.ts scripts/apply-resux-require-fallback.mjs .github/workflows/apply-resux-require-fallback.yml
          git commit -m "fix(vercel): preserve framework dependency fallback"
          git push origin HEAD:fix/vercel-sharp-exports-resolution
