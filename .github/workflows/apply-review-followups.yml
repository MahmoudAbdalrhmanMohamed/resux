name: Apply audit review follow-ups

on:
  push:
    branches:
      - fix/framework-audit-regressions
    paths:
      - .github/scripts/apply-review-followups.mjs
      - .github/workflows/apply-review-followups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/framework-audit-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified review fixes
        run: node .github/scripts/apply-review-followups.mjs
      - name: Commit source fixes and remove temporary patch runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-review-followups.mjs .github/workflows/apply-review-followups.yml
          git add src/compiler/index.ts src/create.ts src/runtime/index.ts
          git commit -m "fix: address framework audit review findings"
          git push origin HEAD:fix/framework-audit-regressions
