name: Apply runtime registry hardening

on:
  push:
    branches:
      - fix/collision-safe-runtime-registries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/collision-safe-runtime-registries
          fetch-depth: 0

      - name: Apply reviewed source transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-runtime-registry-hardening.mjs')
          source = path.read_text()
          source = source.replace(
              '  2,\n  "state serialization output"',
              '  0,\n  "state serialization output"',
          )
          path.write_text(source)
          PY
          set +e
          output="$(node scripts/apply-runtime-registry-hardening.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\n'/'%0A'}"
            escaped="${escaped//$'\r'/'%0D'}"
            echo "::error title=Runtime registry patch failed::$escaped"
            exit "$status"
          fi

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit implementation and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-runtime-registry-hardening.mjs .github/workflows/apply-runtime-registry-hardening.yml
          git add src/runtime/index.ts tests/runtime-state-registry.test.ts
          git commit -m "fix(runtime): harden component state registries"
          git push origin HEAD:fix/collision-safe-runtime-registries
