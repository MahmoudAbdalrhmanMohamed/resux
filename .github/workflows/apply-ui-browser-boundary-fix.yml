name: Apply UI browser boundary fix

on:
  push:
    branches: [fix/ui-browser-kit-boundary]
    paths: [.github/workflows/apply-ui-browser-boundary-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-browser-kit-boundary
          fetch-depth: 0

      - name: Apply exact UI boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui/index.ts')
          text = path.read_text()

          old_import = 'import { defineResuxModule } from "../kit/index.js";'
          new_import = 'import type { ResuxModuleDefinition } from "../kit/index.js";'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one runtime Kit import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          old_open = 'export default defineResuxModule<ResuxUiModuleOptions>({'
          new_open = 'const resuxUiModule = {'
          if text.count(old_open) != 1:
              raise SystemExit(f'Expected exactly one defineResuxModule wrapper, found {text.count(old_open)}')
          text = text.replace(old_open, new_open)

          stripped = text.rstrip()
          if not stripped.endswith('});'):
              raise SystemExit('UI module did not end with the expected defineResuxModule close')
          stripped = stripped[:-3] + '} satisfies ResuxModuleDefinition<ResuxUiModuleOptions>;\n\nexport default resuxUiModule;'
          path.write_text(stripped + '\n')
          PY

          cat > tests/ui-browser-boundary.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";
          import ts from "typescript";

          describe("resuxjs/ui browser boundary", () => {
            it("does not emit a runtime dependency on Node-only Resux Kit", () => {
              const source = readFileSync(new URL("../src/ui/index.ts", import.meta.url), "utf8");
              const output = ts.transpileModule(source, {
                compilerOptions: {
                  module: ts.ModuleKind.ESNext,
                  target: ts.ScriptTarget.ES2022,
                  verbatimModuleSyntax: true,
                },
                fileName: "src/ui/index.ts",
              }).outputText;

              expect(source).toContain('import type { ResuxModuleDefinition } from "../kit/index.js";');
              expect(output).not.toContain('../kit/index.js');
              expect(output).not.toContain('node:async_hooks');
            });
          });
          EOF

          rm .github/workflows/apply-ui-browser-boundary-fix.yml

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add src/ui/index.ts tests/ui-browser-boundary.test.ts .github/workflows/apply-ui-browser-boundary-fix.yml
          git commit -m "fix(ui): keep browser entry independent from Node Kit"
          git push origin HEAD:fix/ui-browser-kit-boundary
