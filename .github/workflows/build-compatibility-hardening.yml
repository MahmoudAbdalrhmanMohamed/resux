name: Apply build compatibility handshake

on:
  push:
    branches:
      - agent/i18n-router-runtime-hardening
    paths:
      - scripts/patch-build-compatibility.mjs
      - .github/workflows/build-compatibility-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/patch-build-compatibility.mjs
      - run: |
          rm scripts/patch-build-compatibility.mjs
          rm .github/workflows/build-compatibility-hardening.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/compiler/index.ts src/runtime/index.ts tests/runtime-performance-regressions.test.ts scripts/patch-build-compatibility.mjs .github/workflows/build-compatibility-hardening.yml
          git commit -m "fix(runtime): detect deployment build mismatches"
          git push origin HEAD:agent/i18n-router-runtime-hardening
