name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, Test, and Pack Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package check
        run: npm run pack:check --if-present

  apply-icon-provider-fix:
    name: Apply Icon Provider Fix
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/full-history-correctness'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Patch protocol-relative providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/icons/index.ts")
          text = path.read_text(encoding="utf8")
          marker = '  if (raw.startsWith("/")) {'
          replacement = (
              '  if (raw.startsWith("//")) {\n'
              '    return DEFAULT_ICON_API_PROVIDER;\n'
              '  }\n'
              + marker
          )
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"expected one provider path branch, found {count}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf8")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate icon fix
        run: |
          npm run typecheck
          npx vitest run tests/icons-regressions.test.ts

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/icons/index.ts
          git commit -m "fix(icons): reject protocol-relative providers"
          git push origin HEAD:audit/full-history-correctness
