name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Build, Test, and Pack Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify runtime bundle
        run: npm run test:bundle

      - name: Verify fixture builds
        run: npm run test:fixtures

      - name: Package check
        run: npm run pack:check

  templates:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template:
          - minimal
          - default
          - full
          - i18n
          - pwa
          - media
          - package-compatibility
          - dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build framework
        run: npm run build

      - name: Verify generated template
        run: npm run test:templates
        env:
          RESUX_TEMPLATE_FILTER: ${{ matrix.template }}

  deployments:
    name: Deployment ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - node
          - static
          - netlify
          - vercel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build framework
        run: npm run build

      - name: Verify deployment output
        run: npm run test:deploy
        env:
          RESUX_DEPLOY_TARGET_FILTER: ${{ matrix.target }}

  compatibility:
    name: Node ${{ matrix.node-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
