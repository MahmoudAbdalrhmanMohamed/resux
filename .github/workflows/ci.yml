name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Production Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Run strict framework quality gates
        run: npm run quality

      - name: Package check
        run: npm run pack:check

  templates:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template:
          - minimal
          - default
          - full
          - i18n
          - pwa
          - media
          - package-compatibility
          - dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build framework
        run: npm run build

      - name: Verify generated template
        run: npm run test:templates
        env:
          RESUX_TEMPLATE_FILTER: ${{ matrix.template }}

  deployments:
    name: Deployment ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - node
          - static
          - netlify
          - vercel
          - cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build framework
        run: npm run build

      - name: Verify deployment output
        run: npm run test:deploy
        env:
          RESUX_DEPLOY_TARGET_FILTER: ${{ matrix.target }}

  compatibility:
    name: Node ${{ matrix.node-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build on supported Node runtime
        run: npm run build

      - name: Verify generated Node 20 starter
        if: matrix.node-version == '20.19.0'
        run: npm run test:templates
        env:
          RESUX_TEMPLATE_FILTER: minimal

      - name: Test on supported Node runtime
        run: npm test

  portability:
    name: ${{ matrix.os }} portability
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build framework
        run: npm run build

      - name: Run framework tests
        run: npm test

      - name: Verify generated starter
        run: npm run test:templates
        env:
          RESUX_TEMPLATE_FILTER: minimal
