name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, Test, and Pack Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package check
        run: npm run pack:check --if-present

  apply-runtime-sonar-fixes:
    name: Apply Remaining Runtime Sonar Fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/full-history-correctness'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply runtime fixes
        run: python3 scripts/apply-runtime-sonar-fixes.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run lifecycle regression tests
        run: >-
          npx vitest run
          tests/client-enhancement-lifecycle.test.ts
          tests/client-enhancement-shared-target.test.ts
          tests/runtime.test.ts

      - name: Commit validated source-only fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sonar): resolve remaining runtime annotations"
          git push origin HEAD:audit/full-history-correctness
