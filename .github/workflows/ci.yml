name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, Test, and Pack Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package check
        run: npm run pack:check --if-present

  apply-runtime-sonar-fixes:
    name: Apply Remaining Runtime Sonar Fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/full-history-correctness'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply runtime fixes
        shell: bash
        run: |
          sed -i '0,/^    2,$/s//    4,/' scripts/apply-runtime-sonar-fixes.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-runtime-sonar-fixes.py")
          text = path.read_text(encoding="utf8")
          old = '''def replace_until(start_marker: str, end_marker: str, replacement: str, label: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              text = text[:start] + replacement + text[end:]
          '''
          new = '''def replace_until(start_marker: str, end_marker: str, replacement: str, label: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              brace_start = text.find("{", start)
              if brace_start < 0:
                  raise SystemExit(f"{label}: opening brace not found")
              depth = 0
              end = -1
              for index in range(brace_start, len(text)):
                  character = text[index]
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end < 0:
                  raise SystemExit(f"{label}: closing brace not found")
              text = text[:start] + replacement + text[end:]
          '''
          if old not in text:
              raise SystemExit("replace_until implementation not found")
          path.write_text(text.replace(old, new, 1), encoding="utf8")
          PY
          python3 scripts/apply-runtime-sonar-fixes.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run lifecycle regression tests
        run: >-
          npx vitest run
          tests/client-enhancement-lifecycle.test.ts
          tests/client-enhancement-shared-target.test.ts
          tests/runtime.test.ts

      - name: Commit validated source-only fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sonar): resolve remaining runtime annotations"
          git push origin HEAD:audit/full-history-correctness
