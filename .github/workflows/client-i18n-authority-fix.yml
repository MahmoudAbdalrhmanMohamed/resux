name: Apply client i18n authority fix

on:
  push:
    branches: [agent/i18n-router-runtime-hardening]
    paths:
      - scripts/patch-client-i18n-authority.mjs
      - .github/workflows/client-i18n-authority-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/patch-client-i18n-authority.mjs
      - run: npm run typecheck
      - run: npx vitest run tests/runtime-performance-regressions.test.ts tests/i18n.test.ts
      - run: |
          rm scripts/patch-client-i18n-authority.mjs
          rm .github/workflows/client-i18n-authority-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts src/i18n/index.ts tests/runtime-performance-regressions.test.ts scripts/patch-client-i18n-authority.mjs .github/workflows/client-i18n-authority-fix.yml
          git commit -m "fix(i18n): keep client runtime authoritative during resume"
          git push origin HEAD:agent/i18n-router-runtime-hardening
