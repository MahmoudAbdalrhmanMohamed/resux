name: Apply client i18n runtime fix

on:
  push:
    branches: [agent/i18n-router-runtime-hardening]
    paths:
      - scripts/patch-client-i18n-runtime.mjs
      - .github/workflows/client-i18n-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/patch-client-i18n-runtime.mjs
      - run: |
          rm scripts/patch-client-i18n-runtime.mjs
          rm .github/workflows/client-i18n-runtime-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts tests/runtime-performance-regressions.test.ts scripts/patch-client-i18n-runtime.mjs .github/workflows/client-i18n-runtime-fix.yml
          git commit -m "fix(i18n): hydrate client locale runtime from payload config"
          git push origin HEAD:agent/i18n-router-runtime-hardening
