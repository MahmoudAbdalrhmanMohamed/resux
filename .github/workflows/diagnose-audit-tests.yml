name: Diagnose audit regression tests

on:
  push:
    branches:
      - fix/framework-audit-regressions
    paths:
      - .github/workflows/diagnose-audit-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    name: ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/framework-audit-regressions.test.ts
          - tests/generated-reactivity-regressions.test.ts
          - tests/compiler-path-regressions.test.ts
          - tests/create-safety-regressions.test.ts
          - tests/runtime-concurrency-regressions.test.ts
          - tests/use-fetch-identity-regressions.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/framework-audit-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run "${{ matrix.test_file }}"

  cleanup:
    name: Remove diagnostic workflow
    if: always()
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/framework-audit-regressions
      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-audit-tests.yml
          git commit -m "chore: remove audit diagnostic workflow"
          git push origin HEAD:fix/framework-audit-regressions
