name: Diagnose production resumability

on:
  push:
    branches:
      - agent/fix-production-resumability

permissions:
  contents: write

jobs:
  reproduce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Resux
        uses: actions/checkout@v4
        with:
          ref: agent/fix-production-resumability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Resux
        run: |
          npm ci
          npm run build

      - name: Build resux-lab and capture output
        shell: bash
        run: |
          set +e
          log="$GITHUB_WORKSPACE/resux-lab-diagnostic.log"
          : > "$log"
          {
            echo '=== clone and install ==='
            git clone --depth=1 https://github.com/MahmoudAbdalrhmanMohamed/resux-lab.git /tmp/resux-lab
            cd /tmp/resux-lab
            npm install --ignore-scripts
            npm install --no-save "$GITHUB_WORKSPACE"
            echo '=== production build ==='
            node "$GITHUB_WORKSPACE/dist/bin.js" build .
            build_status=$?
            echo "BUILD_STATUS=$build_status"
          } >> "$log" 2>&1
          exit 0

      - name: Inspect generated output
        shell: bash
        run: |
          set +e
          log="$GITHUB_WORKSPACE/resux-lab-diagnostic.log"
          cd /tmp/resux-lab 2>/dev/null || exit 0
          node <<'NODE' >> "$log" 2>&1
          const fs = require('node:fs');
          console.log('=== generated handlers ===');
          if (!fs.existsSync('.resux/manifest.json')) {
            console.log('manifest missing');
            process.exit(0);
          }
          const manifest = JSON.parse(fs.readFileSync('.resux/manifest.json', 'utf8'));
          const targets = ['/features/reactivity', '/features/i18n', '/features/errors', '/state', '/media'];
          for (const routePath of targets) {
            const route = manifest.routes.find((entry) => entry.path === routePath);
            console.log(`ROUTE ${routePath}: ${JSON.stringify(route ?? null)}`);
            if (!route) continue;
            const id = route.componentId;
            for (const rel of [`.resux/vite-client/handlers/${id}.mjs`, `.resux/client/handlers/${id}.mjs`]) {
              if (!fs.existsSync(rel)) {
                console.log(`${rel}: missing`);
                continue;
              }
              const source = fs.readFileSync(rel, 'utf8');
              console.log(`${rel}: bytes=${source.length}`);
              for (const needle of ['__rx_expressions', '__rx_expr_0', 'increment', 'setLocale', 'triggerLocalError', 'createClientComponent']) {
                console.log(`  ${needle}=${source.includes(needle)}`);
              }
              const exprAt = source.indexOf('__rx_expr_0');
              if (exprAt >= 0) console.log(`EXPR_CONTEXT ${source.slice(Math.max(0, exprAt - 400), exprAt + 1200)}`);
              if (routePath === '/features/errors') console.log(`ERRORS_HEAD ${source.slice(0, 4000)}`);
            }
          }
          NODE

      - name: Probe local route payloads
        shell: bash
        run: |
          set +e
          log="$GITHUB_WORKSPACE/resux-lab-diagnostic.log"
          cd /tmp/resux-lab 2>/dev/null || exit 0
          if [ ! -f .resux/manifest.json ]; then exit 0; fi
          node "$GITHUB_WORKSPACE/dist/bin.js" preview . --port 4010 >> "$log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4010/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          for target in '/__resux/route?path=%2Ffeatures%2Freactivity' '/__resux/route?path=%2Ffeatures%2Fi18n' '/__resux/route?path=%2Ffeatures%2Ferrors' '/__resux/route?path=%2Fstate' '/__resux/route?path=%2Fmedia'; do
            echo "=== $target ===" >> "$log"
            curl -sS -w '\nHTTP_STATUS=%{http_code}\n' "http://127.0.0.1:4010$target" | head -c 5000 >> "$log" 2>&1
            echo >> "$log"
          done
          kill "$server_pid" 2>/dev/null || true
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resux-lab-diagnostic.log
          git commit -m "chore: capture resux-lab production diagnostics"
          git push origin HEAD:agent/fix-production-resumability
