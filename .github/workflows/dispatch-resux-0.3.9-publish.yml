name: Dispatch trusted Resux 0.3.9 publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-resux-0.3.9-publish.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing npm publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-publish.yml --repo "${{ github.repository }}" --ref main -f release_tag=v0.3.9
