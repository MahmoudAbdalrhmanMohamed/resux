name: Fix global state optimizer

on:
  push:
    branches:
      - feat/global-state

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[optimizer-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/global-state
          fetch-depth: 0
          persist-credentials: true

      - name: Fix optimizer pattern
        run: python .github/scripts/fix-global-state-optimizer.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix global state optimizer [optimizer-fixed]"
          git push origin HEAD:feat/global-state
