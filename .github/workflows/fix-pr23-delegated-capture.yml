name: Fix PR23 delegated capture semantics

on:
  push:
    branches: [perf/resume-on-demand-events]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve capture semantics for resumable media events
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/runtime/index.ts")
          source = path.read_text()
          old = '''    || eventName === "load"
    || eventName === "error"
    || eventName === "invalid"'''
          new = '''    || eventName === "load"
    || eventName === "error"
    || eventName === "loadstart"
    || eventName === "loadedmetadata"
    || eventName === "loadeddata"
    || eventName === "canplay"
    || eventName === "lazy-load-start"
    || eventName === "lazy-load-complete"
    || eventName === "invalid"'''
          if old not in source:
              raise SystemExit("delegated capture anchor not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit focused runtime fix
        run: |
          rm .github/workflows/fix-pr23-delegated-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts .github/workflows/fix-pr23-delegated-capture.yml
          git commit -m "fix(runtime): preserve delegated media capture semantics"
          git push

# retrigger
