name: Final PR 7 hardening

on:
  push:
    branches:
      - feat/global-state
    paths:
      - .github/workflows/fix-pr7-hardening.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/global-state
          fetch-depth: 0

      - name: Apply hardening patch
        run: python .github/scripts/fix-pr7-hardening.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test global state
        run: npm test -- tests/global-state.test.ts

      - name: Commit validated patch
        run: |
          rm .github/workflows/fix-pr7-hardening.yml .github/scripts/fix-pr7-hardening.py
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add -A
          git commit -m "fix(global-state): harden snapshots and prototype keys"
          git push origin HEAD:feat/global-state
