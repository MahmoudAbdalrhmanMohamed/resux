name: Apply PR 7 review fixes

on:
  push:
    branches:
      - feat/global-state
    paths:
      - .github/workflows/fix-pr7-review.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/global-state
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: |
          python .github/scripts/fix-pr7-review.py
          sed -i 's/broken.value.invalid = BigInt(1);/broken.value = BigInt(1);/' tests/global-state.test.ts
          sed -i 's/expect(errorSpy).toHaveBeenCalled();/await waitForCondition(() => errorSpy.mock.calls.length > 0);/' tests/global-state.test.ts

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run global-state tests
        run: npm test -- tests/global-state.test.ts

      - name: Commit validated fixes
        run: |
          rm .github/workflows/fix-pr7-review.yml .github/scripts/fix-pr7-review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(global-state): address review findings"
          git push origin HEAD:feat/global-state
