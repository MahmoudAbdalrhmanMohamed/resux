name: Final PR 8 hardening

on:
  push:
    branches:
      - fix/production-reactivity-hardening
    paths:
      - .github/workflows/fix-pr8-hardening.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-reactivity-hardening
          fetch-depth: 0

      - name: Apply hardening patch
        run: python .github/scripts/fix-pr8-hardening.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Test reactivity
        run: npm test -- tests/reactivity.test.ts tests/package.test.ts

      - name: Verify runtime bundle
        run: npm run test:bundle

      - name: Commit validated patch
        run: |
          rm .github/workflows/fix-pr8-hardening.yml .github/scripts/fix-pr8-hardening.py
          git config user.name "Mahmoud Abdalrahman Mohamed"
          git config user.email "mahnoudhouda5632@gmail.com"
          git add -A
          git commit -m "fix(reactivity): harden proxy identity and sparse arrays"
          git push origin HEAD:fix/production-reactivity-hardening
