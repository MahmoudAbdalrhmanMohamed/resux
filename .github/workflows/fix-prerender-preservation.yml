name: Apply prerender preservation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-prerender-preservation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve user prerender routes on server targets
        shell: python
        run: |
          from pathlib import Path

          cli = Path("src/cli.ts")
          source = cli.read_text(encoding="utf-8")
          old = '''  const deployConfig = await loadResuxDeployConfig(appRoot, outDir);
          const isStatic = deployConfig.target === "static";

          let source = await readFile(configFile, "utf8").catch(() => "");
          '''
          new = '''  const deployConfig = await loadResuxDeployConfig(appRoot, outDir);
          const isStatic = deployConfig.target === "static";
          if (!isStatic) {
            return;
          }

          let source = await readFile(configFile, "utf8").catch(() => "");
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one prerender rewrite block, found {source.count(old)}")
          cli.write_text(source.replace(old, new), encoding="utf-8")

          test_file = Path("tests/cli-generated-dirs.test.ts")
          tests = test_file.read_text(encoding="utf-8")
          marker = '''});

          async function createMinimalProject'''
          regression = '''

            it("preserves user prerender routes for non-static deployment targets", async () => {
              const root = await createMinimalProject("resux-preserve-prerender");
              const nitroConfigFile = path.join(root, "nitro.config.ts");
              await writeFile(
                nitroConfigFile,
                `import { defineNitroConfig } from "nitropack/config";\n\nexport default defineNitroConfig({\n  compatibilityDate: "2026-05-02",\n  customFlag: "keep-me",\n  prerender: { crawlLinks: false, routes: ["/media"] }\n});\n`,
                "utf8",
              );

              await runResuxCli(["prepare", root]);

              const nitroConfig = await readFile(nitroConfigFile, "utf8");
              expect(nitroConfig).toContain('routes: ["/media"]');
              expect(nitroConfig).toContain('customFlag: "keep-me"');
            }, 120000);
          });

          async function createMinimalProject'''
          if marker not in tests:
              raise SystemExit("Could not find cli-generated-dirs describe terminator")
          test_file.write_text(tests.replace(marker, regression, 1), encoding="utf-8")

      - name: Bump framework patch version
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.3.11 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'packages/create-resuxjs/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = '0.3.11'
          pkg.dependencies.resuxjs = '^0.3.11'
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Run prerender regression test
        run: npx vitest run tests/cli-generated-dirs.test.ts

      - name: Commit framework fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-prerender-preservation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli.ts tests/cli-generated-dirs.test.ts package.json package-lock.json packages/create-resuxjs/package.json .github/workflows/fix-prerender-preservation.yml
          git diff --cached --check
          git commit -m 'fix(build): preserve configured prerender routes'
          git push origin HEAD:main
