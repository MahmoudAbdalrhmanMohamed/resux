name: Framework audit patch runner

on:
  push:
    branches:
      - fix/framework-audit-regressions
    paths:
      - scripts/apply-framework-audit-patches.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/framework-audit-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/apply-framework-audit-patches.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(runtime): finish request-local error isolation"
          git push origin HEAD:fix/framework-audit-regressions
