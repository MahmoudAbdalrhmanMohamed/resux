name: Apply no-prefix i18n hardening

on:
  push:
    branches:
      - agent/i18n-router-runtime-hardening
    paths:
      - scripts/patch-i18n-no-prefix.mjs
      - .github/workflows/i18n-no-prefix-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/patch-i18n-no-prefix.mjs
      - run: |
          rm scripts/patch-i18n-no-prefix.mjs
          rm .github/workflows/i18n-no-prefix-hardening.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/index.ts tests/i18n.test.ts scripts/patch-i18n-no-prefix.mjs .github/workflows/i18n-no-prefix-hardening.yml
          git commit -m "fix(i18n): support no-prefix locale switching"
          git push origin HEAD:agent/i18n-router-runtime-hardening
