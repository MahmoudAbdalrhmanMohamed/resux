name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      create_package_name: ${{ steps.metadata.outputs.create_package_name }}
      create_package_version: ${{ steps.metadata.outputs.create_package_version }}
      dist_tag: ${{ steps.metadata.outputs.dist_tag }}

    steps:
      - name: Checkout published release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Package version '${PACKAGE_VERSION}' must be valid semver."
            exit 1
          fi

          RELEASE_TAG="v${PACKAGE_VERSION}"
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${TAG_COMMIT}" = "${HEAD_COMMIT}" || {
            echo "Published release checkout does not match ${RELEASE_TAG}."
            exit 1
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCKFILE_NAME="$(node -p "require('./package-lock.json').name")"
          LOCKFILE_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCKFILE_ROOT_NAME="$(node -p "require('./package-lock.json').packages[''].name")"
          LOCKFILE_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          CREATE_PACKAGE_NAME="$(node -p "require('./packages/create-resuxjs/package.json').name")"
          CREATE_PACKAGE_VERSION="$(node -p "require('./packages/create-resuxjs/package.json').version")"
          CREATE_FRAMEWORK_RANGE="$(node -p "require('./packages/create-resuxjs/package.json').dependencies.resuxjs")"
          CREATE_REPOSITORY_URL="$(node -p "require('./packages/create-resuxjs/package.json').repository.url")"

          test "${PACKAGE_NAME}" = "resuxjs" || {
            echo "Expected package name resuxjs, got ${PACKAGE_NAME}."
            exit 1
          }

          test "${CREATE_PACKAGE_NAME}" = "create-resuxjs" || {
            echo "Expected package name create-resuxjs, got ${CREATE_PACKAGE_NAME}."
            exit 1
          }

          test "${CREATE_PACKAGE_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "create-resuxjs version ${CREATE_PACKAGE_VERSION} does not match resuxjs ${PACKAGE_VERSION}."
            exit 1
          }

          test "${CREATE_FRAMEWORK_RANGE}" = "^${PACKAGE_VERSION}" || {
            echo "create-resuxjs depends on resuxjs ${CREATE_FRAMEWORK_RANGE}; expected ^${PACKAGE_VERSION}."
            exit 1
          }

          test "${CREATE_REPOSITORY_URL}" = "git+https://github.com/MahmoudAbdalrhmanMohamed/resux.git" || {
            echo "create-resuxjs repository URL must match the GitHub repository used by npm Trusted Publishing."
            exit 1
          }

          test "${LOCKFILE_NAME}" = "${PACKAGE_NAME}" || {
            echo "package-lock.json name ${LOCKFILE_NAME} does not match ${PACKAGE_NAME}."
            exit 1
          }

          test "${LOCKFILE_ROOT_NAME}" = "${PACKAGE_NAME}" || {
            echo "package-lock.json root name ${LOCKFILE_ROOT_NAME} does not match ${PACKAGE_NAME}."
            exit 1
          }

          test "${LOCKFILE_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "package-lock.json version ${LOCKFILE_VERSION} does not match ${PACKAGE_VERSION}."
            exit 1
          }

          test "${LOCKFILE_ROOT_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "package-lock.json root version ${LOCKFILE_ROOT_VERSION} does not match ${PACKAGE_VERSION}."
            exit 1
          }

          node -e "const pkg=require('./package.json'); if (pkg.private) throw new Error('private:true packages cannot be published')"
          node -e "const pkg=require('./packages/create-resuxjs/package.json'); if (pkg.private) throw new Error('private:true create package cannot be published')"

          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "create_package_name=${CREATE_PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "create_package_version=${CREATE_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Rolldown Linux native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Run strict framework quality gates
        run: npm run quality

      - name: Verify deployment targets
        run: npm run verify:deploy-targets

      - name: Verify generated templates
        run: npm run test:templates

      - name: Verify package contents
        run: npm run pack:check

      - name: Pack immutable release tarballs
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          CREATE_PACKAGE_NAME: ${{ steps.metadata.outputs.create_package_name }}
          CREATE_PACKAGE_VERSION: ${{ steps.metadata.outputs.create_package_version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          npm pack ./packages/create-resuxjs --pack-destination release-artifacts
          test -f "release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz"
          test -f "release-artifacts/${CREATE_PACKAGE_NAME}-${CREATE_PACKAGE_VERSION}.tgz"

      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated npm artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ needs.validate.outputs.package_version }}
      cancel-in-progress: false

    steps:
      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Require npm with Trusted Publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (
            !Number.isInteger(major) ||
            !Number.isInteger(minor) ||
            !Number.isInteger(patch) ||
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error(`npm ${version} is too old for Trusted Publishing; require >=11.5.1`);
          }
          NODE

      - name: Download validated release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: release-artifacts

      - name: Verify downloaded artifact names
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          CREATE_PACKAGE_NAME: ${{ needs.validate.outputs.create_package_name }}
          CREATE_PACKAGE_VERSION: ${{ needs.validate.outputs.create_package_version }}
        run: |
          set -euo pipefail
          test -f "release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz"
          test -f "release-artifacts/${CREATE_PACKAGE_NAME}-${CREATE_PACKAGE_VERSION}.tgz"

      - name: Check whether framework version already exists
        id: framework_published
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping framework publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether create package version already exists
        id: create_published
        shell: bash
        env:
          CREATE_PACKAGE_NAME: ${{ needs.validate.outputs.create_package_name }}
          CREATE_PACKAGE_VERSION: ${{ needs.validate.outputs.create_package_version }}
        run: |
          if npm view "${CREATE_PACKAGE_NAME}@${CREATE_PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME}@${CREATE_PACKAGE_VERSION} is already published; skipping create package publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether create package exists on npm
        id: create_package
        if: steps.create_published.outputs.exists == 'false'
        shell: bash
        env:
          CREATE_PACKAGE_NAME: ${{ needs.validate.outputs.create_package_name }}
        run: |
          if npm view "${CREATE_PACKAGE_NAME}" name >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME} already exists on npm and must authorize this workflow as its Trusted Publisher."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME} does not exist on npm yet."
          fi

      - name: Fail if create package is not bootstrapped
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'false'
        shell: bash
        env:
          CREATE_PACKAGE_NAME: ${{ needs.validate.outputs.create_package_name }}
        run: |
          echo "${CREATE_PACKAGE_NAME} must be published once by an npm maintainer before Trusted Publishing can be configured."
          exit 1

      - name: Publish framework package with provenance
        if: steps.framework_published.outputs.exists == 'false'
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: npm publish "release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz" --access public --tag "${DIST_TAG}" --provenance

      - name: Publish create package with provenance
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'true'
        shell: bash
        env:
          CREATE_PACKAGE_NAME: ${{ needs.validate.outputs.create_package_name }}
          CREATE_PACKAGE_VERSION: ${{ needs.validate.outputs.create_package_version }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: npm publish "release-artifacts/${CREATE_PACKAGE_NAME}-${CREATE_PACKAGE_VERSION}.tgz" --access public --tag "${DIST_TAG}" --provenance
