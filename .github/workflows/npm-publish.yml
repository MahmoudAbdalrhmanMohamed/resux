name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - packages/create-resuxjs/package.json
      - .github/workflows/npm-publish.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver tag to publish, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout branch publish source
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            push)
              if [[ "${PUSH_REF_TYPE}" == "branch" ]]; then
                PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                TAG="v${PACKAGE_VERSION}"
              else
                TAG="${PUSH_TAG}"
              fi
              ;;
            release) TAG="${RELEASE_TAG}" ;;
            workflow_dispatch) TAG="${MANUAL_TAG}" ;;
            *) echo "Unsupported event: ${EVENT_NAME}"; exit 1 ;;
          esac

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${TAG}' must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        if: github.event_name != 'push' || github.ref_type != 'branch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Setup modern npm for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11
          node --version
          npm --version

      - name: Validate release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCKFILE_NAME="$(node -p "require('./package-lock.json').name")"
          LOCKFILE_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCKFILE_ROOT_NAME="$(node -p "require('./package-lock.json').packages[''].name")"
          LOCKFILE_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          CREATE_PACKAGE_NAME="$(node -p "require('./packages/create-resuxjs/package.json').name")"
          CREATE_PACKAGE_VERSION="$(node -p "require('./packages/create-resuxjs/package.json').version")"
          CREATE_FRAMEWORK_RANGE="$(node -p "require('./packages/create-resuxjs/package.json').dependencies.resuxjs")"

          test "${PACKAGE_NAME}" = "resuxjs" || {
            echo "Expected package name resuxjs, got ${PACKAGE_NAME}."
            exit 1
          }

          test "${CREATE_PACKAGE_NAME}" = "create-resuxjs" || {
            echo "Expected package name create-resuxjs, got ${CREATE_PACKAGE_NAME}."
            exit 1
          }

          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}" || {
            echo "Tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          }

          test "${CREATE_PACKAGE_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "create-resuxjs version ${CREATE_PACKAGE_VERSION} does not match resuxjs ${PACKAGE_VERSION}."
            exit 1
          }

          test "${CREATE_FRAMEWORK_RANGE}" = "^${PACKAGE_VERSION}" || {
            echo "create-resuxjs depends on resuxjs ${CREATE_FRAMEWORK_RANGE}; expected ^${PACKAGE_VERSION}."
            exit 1
          }

          test "${LOCKFILE_NAME}" = "${PACKAGE_NAME}" || {
            echo "package-lock.json name ${LOCKFILE_NAME} does not match ${PACKAGE_NAME}."
            exit 1
          }

          test "${LOCKFILE_ROOT_NAME}" = "${PACKAGE_NAME}" || {
            echo "package-lock.json root name ${LOCKFILE_ROOT_NAME} does not match ${PACKAGE_NAME}."
            exit 1
          }

          test "${LOCKFILE_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "package-lock.json version ${LOCKFILE_VERSION} does not match ${PACKAGE_VERSION}."
            exit 1
          }

          test "${LOCKFILE_ROOT_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "package-lock.json root version ${LOCKFILE_ROOT_VERSION} does not match ${PACKAGE_VERSION}."
            exit 1
          }

          node -e "const pkg=require('./package.json'); if (pkg.private) throw new Error('private:true packages cannot be published')"
          node -e "const pkg=require('./packages/create-resuxjs/package.json'); if (pkg.private) throw new Error('private:true create package cannot be published')"

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "CREATE_PACKAGE_NAME=${CREATE_PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "CREATE_PACKAGE_VERSION=${CREATE_PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Create version tag for main publish
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; keeping the existing tag."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Rolldown Linux native binding
        if: runner.os == 'Linux'
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm pack --dry-run ./packages/create-resuxjs

      - name: Check whether framework version already exists
        id: framework_published
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping framework publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether create package version already exists
        id: create_published
        shell: bash
        run: |
          if npm view "${CREATE_PACKAGE_NAME}@${CREATE_PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME}@${CREATE_PACKAGE_VERSION} is already published; skipping create package publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether create package exists on npm
        id: create_package
        if: steps.create_published.outputs.exists == 'false'
        shell: bash
        run: |
          if npm view "${CREATE_PACKAGE_NAME}" name >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME} already exists on npm; Trusted Publishing can be used."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${CREATE_PACKAGE_NAME} does not exist on npm yet; the first publish requires authenticated bootstrap publishing."
          fi

      - name: Check NPM bootstrap token availability
        id: npm_token
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'false'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is available for the one-time create-resuxjs bootstrap publish."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured."
          fi

      - name: Resolve npm dist-tag
        id: dist
        if: steps.framework_published.outputs.exists == 'false' || steps.create_published.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish framework package
        if: steps.framework_published.outputs.exists == 'false'
        run: npm publish --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Publish create package with Trusted Publishing
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'true'
        run: npm publish ./packages/create-resuxjs --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Bootstrap create package with NPM_TOKEN
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'false' && steps.npm_token.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packages/create-resuxjs --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Fail with create package bootstrap guidance
        if: steps.create_published.outputs.exists == 'false' && steps.create_package.outputs.exists == 'false' && steps.npm_token.outputs.available != 'true'
        shell: bash
        run: |
          echo "create-resuxjs does not exist on npm yet, so Trusted Publishing cannot bootstrap it."
          echo "Add a repository secret named NPM_TOKEN with publish permission, rerun once, then configure create-resuxjs Trusted Publishing for .github/workflows/npm-publish.yml."
          exit 1
