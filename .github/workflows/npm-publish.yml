name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver tag to publish, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            push) TAG="${PUSH_TAG}" ;;
            release) TAG="${RELEASE_TAG}" ;;
            workflow_dispatch) TAG="${MANUAL_TAG}" ;;
            *) echo "Unsupported event: ${EVENT_NAME}"; exit 1 ;;
          esac

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${TAG}' must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org/"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Ensure rolldown Linux native binding
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" || npm install --no-save @rolldown/binding-linux-x64-gnu

      - name: Validate release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          test "${PACKAGE_NAME}" = "resuxjs" || {
            echo "Expected package name resuxjs, got ${PACKAGE_NAME}."
            exit 1
          }

          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}" || {
            echo "Tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          }

          node -e "const pkg=require('./package.json'); if (pkg.private) throw new Error('private:true packages cannot be published')"

          echo "package-name=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "package-version=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check whether version already exists
        id: published
        shell: bash
        run: |
          if npm view "${package-name}@${package-version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${package-name}@${package-version} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public --provenance
