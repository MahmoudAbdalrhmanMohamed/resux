name: Optimize global state

on:
  push:
    branches:
      - feat/global-state

permissions:
  contents: write

concurrency:
  group: optimize-global-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[global-state-optimized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/global-state
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted refresh optimization
        run: python .github/scripts/optimize-global-state.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit validated optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: refresh only global-state consumers [global-state-optimized]"
          git push origin HEAD:feat/global-state
