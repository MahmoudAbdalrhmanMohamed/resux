name: Patch i18n history resume

on:
  push:
    branches:
      - fix/i18n-history-resume
    paths:
      - ".github/workflows/patch-i18n-history-resume.yml"

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/i18n-history-resume
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply history-resume fix
        run: node scripts/patch-i18n-history-resume.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused regressions
        run: npx vitest run tests/runtime-performance-regressions.test.ts tests/resumable-event-locals.test.ts tests/server-i18n-setup-context.test.ts

      - name: Remove temporary patch files
        run: |
          git rm .github/workflows/patch-i18n-history-resume.yml scripts/patch-i18n-history-resume.mjs

      - name: Commit verified fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts tests/runtime-performance-regressions.test.ts
          git commit -m "fix(i18n): refresh locale state on history navigation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/i18n-history-resume
