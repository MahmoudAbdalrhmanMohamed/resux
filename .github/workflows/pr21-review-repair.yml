name: Apply PR 21 review repair

on:
  push:
    branches:
      - fix/vercel-sharp-exports-resolution
    paths:
      - .github/workflows/pr21-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-sharp-exports-resolution
      - name: Apply Nitro config upgrader fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path("src/cli.ts")
          source = file.read_text(encoding="utf-8")
          function_anchor = "async function upgradeNitroConfigForResux"
          write_anchor = '  if (updated === source) {'
          function_index = source.find(function_anchor)
          if function_index < 0:
              raise SystemExit("upgradeNitroConfigForResux not found")
          insert_index = source.find(write_anchor, function_index)
          if insert_index < 0:
              raise SystemExit("upgradeNitroConfigForResux write guard not found")

          insertion = '''  const cloudflareNodeCompatPattern = /(\\bcloudflare\\s*:\\s*\\{[\\s\\S]*?\\bnodeCompat\\s*:\\s*)(?:true|false)/;
          if (cloudflareNodeCompatPattern.test(updated)) {
            updated = updated.replace(cloudflareNodeCompatPattern, "$1true");
          } else if (/\\bcloudflare\\s*:\\s*\\{/.test(updated)) {
            updated = updated.replace(
              /\\bcloudflare\\s*:\\s*\\{/,
              (match) => `${match}\n    nodeCompat: true,`,
            );
          } else {
            updated = updated.replace(
              /export\\s+default\\s+defineNitroConfig\\s*\\(\\s*\\{/,
              (match) => `${match}\n  cloudflare: {\n    nodeCompat: true\n  },`,
            );
          }

          '''
          if "cloudflareNodeCompatPattern" in source[function_index:insert_index]:
              raise SystemExit("Cloudflare nodeCompat upgrader already present")
          source = source[:insert_index] + insertion + source[insert_index:]
          file.write_text(source, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/pr21-review-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.ts .github/workflows/pr21-review-repair.yml
          git commit -m "fix(cli): upgrade existing Cloudflare Nitro config"
          git push origin HEAD:fix/vercel-sharp-exports-resolution
