name: Apply PR 21 runtime lazy-import repair

on:
  push:
    branches:
      - fix/vercel-sharp-exports-resolution
    paths:
      - .github/workflows/pr21-runtime-lazy-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-sharp-exports-resolution
      - name: Keep build-only/native modules out of deployment bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('src/cli.ts')
          source = file.read_text(encoding='utf-8')

          anchor = 'async function runCompilerBuild(\n'
          idx = source.find(anchor)
          if idx < 0:
              raise SystemExit('runCompilerBuild not found')
          helper = '''async function importRuntimeModule<T>(specifier: string): Promise<T> {
            return import(specifier) as Promise<T>;
          }

          '''
          if 'async function importRuntimeModule<T>' not in source:
              source = source[:idx] + helper + source[idx:]

          source = source.replace(
              '  const { buildProject } = await import("./compiler/index.js");',
              '  const { buildProject } = await importRuntimeModule<typeof import("./compiler/index.js")>("./compiler/index.js");',
          )
          source = source.replace(
              '    await Promise.all([import("vite"), import("@vitejs/plugin-vue")]);',
              '    await Promise.all([\n      importRuntimeModule<typeof import("vite")>("vite"),\n      importRuntimeModule<typeof import("@vitejs/plugin-vue")>("@vitejs/plugin-vue"),\n    ]);',
          )
          source = source.replace(
              '      const sharpModule = await import("sharp");',
              '      const sharpModule = await importRuntimeModule<typeof import("sharp")>("sharp");',
          )

          file.write_text(source, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/pr21-runtime-lazy-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.ts .github/workflows/pr21-runtime-lazy-fix.yml
          git commit -m "fix(runtime): keep build-only modules out of edge bundles"
          git push origin HEAD:fix/vercel-sharp-exports-resolution
