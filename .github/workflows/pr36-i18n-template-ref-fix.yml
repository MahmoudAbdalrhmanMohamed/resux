name: PR 36 i18n template ref fix

on:
  push:
    branches:
      - fix/i18n-resume-authority
    paths:
      - .github/workflows/pr36-i18n-template-ref-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/i18n-resume-authority
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Apply compiler fix
        run: node scripts/pr36-i18n-template-ref-fix.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regressions
        run: npx vitest run tests/resumable-event-locals.test.ts tests/compiler.test.ts tests/server-i18n-setup-context.test.ts tests/runtime-performance-regressions.test.ts
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(compiler): unwrap destructured i18n refs in templates"
          git push origin HEAD:fix/i18n-resume-authority
