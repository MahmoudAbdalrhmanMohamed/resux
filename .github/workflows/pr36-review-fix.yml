name: PR 36 review fix

on:
  push:
    branches:
      - fix/i18n-resume-authority
    paths:
      - .github/workflows/pr36-review-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/i18n-resume-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply review fixes
        run: node scripts/pr36-review-fix.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regressions
        run: npx vitest run tests/compiler.test.ts tests/resumable-event-locals.test.ts tests/runtime-performance-regressions.test.ts tests/server-i18n-setup-context.test.ts
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): tighten resumable event local capture"
          git push origin HEAD:fix/i18n-resume-authority
