name: Verify PR 36 Sonar fixes

on:
  push:
    branches: [fix/i18n-resume-authority]
    paths:
      - scripts/pr36-sonar-fix.mjs
      - .github/workflows/pr36-sonar-fix.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-resume-authority
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply structural Sonar fixes
        run: node scripts/pr36-sonar-fix.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused regressions
        run: npx vitest run tests/resumable-event-locals.test.ts tests/runtime-performance-regressions.test.ts tests/server-i18n-setup-context.test.ts
      - name: Remove temporary verifier files
        run: rm -f scripts/pr36-sonar-fix.mjs .github/workflows/pr36-sonar-fix.yml
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts tests/resumable-event-locals.test.ts scripts/pr36-sonar-fix.mjs .github/workflows/pr36-sonar-fix.yml
          git commit -m "refactor(runtime): deduplicate resumable native serialization"
          git push origin HEAD:fix/i18n-resume-authority
