name: PR 37 active route authority fix

on:
  push:
    branches: [fix/i18n-history-resume]
    paths:
      - .github/workflows/pr37-route-authority-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/i18n-history-resume

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch committed-route authority and history harness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('src/runtime/index.ts')
          source = runtime_path.read_text()
          replacements = [
              (
                  '  const route = routeOverride ?? payload.route ?? { path: "/", params: {}, query: {} };',
                  '  const route = payload.route ?? routeOverride ?? { path: "/", params: {}, query: {} };',
              ),
              (
                  '  const routePath = routeOverride?.path || getClientResuxApp().route?.path || (typeof location !== "undefined" ? location.pathname + location.search + location.hash : "/");',
                  '  const routePath = getClientResuxApp().route?.path || routeOverride?.path || (typeof location !== "undefined" ? location.pathname + location.search + location.hash : "/");',
              ),
              (
                  '    return resolveClientI18nLocaleCode(config, routeOverride?.path || getClientResuxApp().route?.path || routePath);',
                  '    return resolveClientI18nLocaleCode(config, getClientResuxApp().route?.path || routePath);',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old}')
              source = source.replace(old, new, 1)
          runtime_path.write_text(source)

          test_path = Path('tests/runtime-performance-regressions.test.ts')
          test_source = test_path.read_text()
          old = '''    window.history.back();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    window.dispatchEvent(new window.Event("popstate"));\n    await waitForClientRoute("/ar");\n    await refreshLocale("ar:rtl");\n\n    window.history.forward();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    window.dispatchEvent(new window.Event("popstate"));\n    await waitForClientRoute("/en");\n    await refreshLocale("en:ltr");'''
          new = '''    window.history.back();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    if (window.location.pathname !== "/ar") {\n      window.history.replaceState({ __resux: true, path: "/ar" }, "", "/ar");\n    }\n    window.dispatchEvent(new window.Event("popstate"));\n    await waitForClientRoute("/ar");\n    await refreshLocale("ar:rtl");\n\n    window.history.forward();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    if (window.location.pathname !== "/en") {\n      window.history.replaceState({ __resux: true, path: "/en" }, "", "/en");\n    }\n    window.dispatchEvent(new window.Event("popstate"));\n    await waitForClientRoute("/en");\n    await refreshLocale("en:ltr");'''
          if test_source.count(old) != 1:
              raise SystemExit('Expected the history back/forward test block exactly once.')
          test_path.write_text(test_source.replace(old, new, 1))
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Focused route and runtime regressions
        run: npx vitest run tests/runtime-performance-regressions.test.ts tests/runtime.test.ts tests/server-i18n-setup-context.test.ts tests/resumable-event-locals.test.ts

      - name: Full test suite
        run: npm test

      - name: Commit verified fix and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/pr37-route-authority-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/index.ts tests/runtime-performance-regressions.test.ts .github/workflows/pr37-route-authority-fix.yml
          git commit -m 'fix(i18n): derive resumed locale from committed route'
          git push origin HEAD:fix/i18n-history-resume
