name: Apply PR53 generator fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/nitropack-2.13.4
    paths:
      - .github/workflows/pr53-generator-fix.yml

permissions:
  contents: write

jobs:
  apply-generator-fix:
    if: github.repository == 'MahmoudAbdalrhmanMohamed/resux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/nitropack-2.13.4
          fetch-depth: 0

      - name: Add consumer root override
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/create.ts';
          const source = fs.readFileSync(file, 'utf8');
          const needle = `    engines: {\n      node: \">=20.19.0\",\n    },\n`;
          const replacement = `${needle}    overrides: {\n      nitropack: {\n        \\"rollup-plugin-visualizer\\": \\"6.0.11\\",\n      },\n    },\n`;
          if (source.includes(replacement)) process.exit(0);
          if (!source.includes(needle)) throw new Error('starter package engine block not found');
          fs.writeFileSync(file, source.replace(needle, replacement));
          NODE

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/create.ts
          git rm --ignore-unmatch .github/workflows/pr53-generator-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: pin visualizer in generated starters"
          git push origin HEAD:dependabot/npm_and_yarn/nitropack-2.13.4
