name: Refine shared enhancement observer

on:
  push:
    branches:
      - perf/client-enhancement-lifecycle

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/client-enhancement-lifecycle
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refine and verify framework runtime
        id: verify
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Refresh lockfile for verification'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo '## Install dependencies'
            npm ci --no-audit --no-fund
            echo '## Apply observer refinement'
            node scripts/refine-shared-enhancement-observer.mjs
            echo '## Typecheck'
            npm run typecheck
            echo '## Tests'
            npm test
          } 2>&1 | tee shared-observer-verification.log

      - name: Commit verified refinement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- package-lock.json
          rm shared-observer-verification.log
          rm scripts/refine-shared-enhancement-observer.mjs
          rm .github/workflows/refine-shared-enhancement-observer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): preserve shared-target enhancement callbacks"
          git push origin HEAD:perf/client-enhancement-lifecycle

      - name: Commit verification diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -f shared-observer-verification.log
          cp shared-observer-verification.log /tmp/shared-observer-verification.log
          git reset --hard HEAD
          cp /tmp/shared-observer-verification.log shared-observer-verification.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared-observer-verification.log
          git commit -m "test(runtime): record shared observer verification failure"
          git push origin HEAD:perf/client-enhancement-lifecycle
