name: Refresh PR 46 lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - feat/build-contract-tsdown
    paths:
      - .github/workflows/refresh-pr46-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/build-contract-tsdown

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Regenerate package-lock with npm 10
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const lock=require('./package-lock.json'); console.log('lockfile npm-compatible:', lock.lockfileVersion)"
          node -e "const lock=require('./package-lock.json'); const version=lock.packages?.['node_modules/tsdown']?.version; if(version!=='0.19.0') throw new Error('unexpected tsdown '+version)"

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh lockfile with npm 10"
          git push origin HEAD:feat/build-contract-tsdown
