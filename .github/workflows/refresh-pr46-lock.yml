name: Refresh PR 46 lockfile

on:
  push:
    branches:
      - feat/build-contract-tsdown
    paths:
      - .github/pr46-lock-refresh.trigger

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/build-contract-tsdown

      - name: Use Node 20.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Generate lockfile with latest npm 10
        run: |
          rm -rf node_modules package-lock.json
          npm install --global npm@10.9.4
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate with Node 20 bundled npm version
        run: |
          rm -rf node_modules
          npm install --global npm@10.8.2
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:dependencies

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "chore: regenerate npm 10 compatible lockfile"
          git push origin HEAD:feat/build-contract-tsdown
