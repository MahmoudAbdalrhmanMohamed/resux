name: Regenerate Nitro lock with npm 10

on:
  push:
    branches:
      - dependabot/npm_and_yarn/nitropack-2.13.4

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node 20.19 with bundled npm 10
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify npm 10 clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lock and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-nitro-lock-npm10.yml
          git add package-lock.json
          git commit -m "build: regenerate Nitro lock with npm 10"
          git push origin "HEAD:${GITHUB_REF_NAME}"
