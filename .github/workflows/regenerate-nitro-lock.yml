name: Regenerate Nitro lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/nitropack-2.13.4

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use repository npm version
        run: npm install --global npm@11.19.1 --no-audit --no-fund

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lock and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-nitro-lock.yml
          git add package-lock.json
          git commit -m "build: regenerate Nitro lock for Node 20 compatibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
