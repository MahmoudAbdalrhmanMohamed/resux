name: Sync Resux 0.3.10 release metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.10-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/resux-0.3.10
          persist-credentials: true
      - name: Synchronize release metadata
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const update = (path, mutate) => {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            mutate(data);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          };
          update('package.json', pkg => { pkg.version = '0.3.10'; });
          update('package-lock.json', lock => {
            lock.version = '0.3.10';
            lock.packages[''].version = '0.3.10';
          });
          update('packages/create-resuxjs/package.json', pkg => {
            pkg.version = '0.3.10';
            pkg.dependencies.resuxjs = '^0.3.10';
          });
          NODE
          node -e "const p=require('./package.json'), l=require('./package-lock.json'), c=require('./packages/create-resuxjs/package.json'); if(p.version!=='0.3.10'||l.version!=='0.3.10'||l.packages[''].version!=='0.3.10'||c.version!=='0.3.10'||c.dependencies.resuxjs!=='^0.3.10') process.exit(1)"
      - name: Commit synchronized metadata
        run: |
          if git diff --quiet -- package.json package-lock.json packages/create-resuxjs/package.json; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json packages/create-resuxjs/package.json
          git commit -m 'chore(release): sync 0.3.10 metadata'
          git push origin HEAD:release/resux-0.3.10
