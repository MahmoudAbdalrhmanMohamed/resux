name: Prepare Resux 0.3.8

on:
  push:
    branches:
      - release/resux-0.3.8

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prep-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          root.version = '0.3.8';
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');

          const create = JSON.parse(fs.readFileSync('packages/create-resuxjs/package.json', 'utf8'));
          create.version = '0.3.8';
          create.dependencies.resuxjs = '^0.3.8';
          fs.writeFileSync('packages/create-resuxjs/package.json', JSON.stringify(create, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.3.8';
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock.json is missing packages[""]');
          }
          lock.packages[''].name = 'resuxjs';
          lock.packages[''].version = '0.3.8';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.3.8"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.8"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.3.8"
          test "$(node -p "require('./packages/create-resuxjs/package.json').version")" = "0.3.8"
          test "$(node -p "require('./packages/create-resuxjs/package.json').dependencies.resuxjs")" = "^0.3.8"

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/create-resuxjs/package.json
          if git diff --cached --quiet; then
            echo "Release metadata already prepared."
            exit 0
          fi
          git commit -m "chore(release): prepare 0.3.8 [release-prep-done]"
          git push origin HEAD:release/resux-0.3.8
