name: Inspect Resux 0.3.8 Publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.8-status.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Capture publication status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const runs = JSON.parse(execFileSync('gh', [
            'run', 'list',
            '--workflow', 'npm-publish.yml',
            '--limit', '10',
            '--json', 'databaseId,status,conclusion,event,headBranch,createdAt,url'
          ], { encoding: 'utf8' }));
          const view = (name) => {
            try {
              return execFileSync('npm', ['view', name, 'version'], { encoding: 'utf8' }).trim();
            } catch {
              return '';
            }
          };
          fs.writeFileSync('.release-0.3.8-status.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            framework: view('resuxjs@0.3.8'),
            create: view('create-resuxjs@0.3.8'),
            runs,
          }, null, 2) + '\n');
          NODE

      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-0.3.8-status.json
          git commit -m "chore(release): record 0.3.8 publication status"
          git push origin HEAD:main
