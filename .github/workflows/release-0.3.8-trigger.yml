name: Release Resux 0.3.8 Trigger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.8-trigger.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.3.8"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.8"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.3.8"
          test "$(node -p "require('./packages/create-resuxjs/package.json').version")" = "0.3.8"
          test "$(node -p "require('./packages/create-resuxjs/package.json').dependencies.resuxjs")" = "^0.3.8"

      - name: Create v0.3.8 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.3.8 >/dev/null 2>&1; then
            echo "v0.3.8 already exists; refusing to move an existing release tag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.3.8 -m "Resux 0.3.8"
          git push origin refs/tags/v0.3.8

      - name: Dispatch trusted npm publication
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
          gh workflow run npm-publish.yml --ref main -f release_tag=v0.3.8

      - name: Wait for npm publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq '.[] | select(.createdAt >= env.STARTED_AT) | .databaseId' | head -n1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find the dispatched npm publication run."
            exit 1
          fi
          echo "Watching npm publication run ${RUN_ID}."
          gh run watch "$RUN_ID" --exit-status

      - name: Clean release trigger
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-0.3.8-trigger.yml
          git commit -m "chore(release): clean 0.3.8 trigger"
          git push origin HEAD:main
