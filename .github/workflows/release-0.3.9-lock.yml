name: Preserve Resux 0.3.9 lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.9-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/resux-0.3.9
          fetch-depth: 0
          persist-credentials: true
      - name: Restore main lockfile and change only release version metadata
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          let text = fs.readFileSync('package-lock.json', 'utf8');
          const top = '  "version": "0.3.8",';
          const root = '      "version": "0.3.8",';
          if (!text.includes(top) || !text.includes(root)) {
            throw new Error('Expected 0.3.8 lockfile metadata was not found in main.');
          }
          text = text.replace(top, '  "version": "0.3.9",');
          text = text.replace(root, '      "version": "0.3.9",');
          fs.writeFileSync('package-lock.json', text);
          NODE
          node -e "const l=require('./package-lock.json'); if(l.version!=='0.3.9'||l.packages[''].version!=='0.3.9') process.exit(1)"
      - name: Commit preserved lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(release): preserve 0.3.9 lockfile metadata'
          git push origin HEAD:release/resux-0.3.9
