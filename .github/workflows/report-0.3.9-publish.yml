name: Inspect Resux 0.3.9 publish run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-0.3.9-publish.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Record publisher runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow npm-publish.yml --limit 10 --json databaseId,status,conclusion,event,displayTitle,createdAt,headSha > .resux-0.3.9-publish-runs.json
          cat .resux-0.3.9-publish-runs.json
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .resux-0.3.9-publish-runs.json
          git commit -m 'chore(release): record 0.3.9 publisher status'
          git push
