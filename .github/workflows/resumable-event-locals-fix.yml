name: Apply resumable event locals fix

on:
  push:
    branches: [fix/i18n-resume-authority]
    paths:
      - scripts/patch-resumable-event-locals.mjs
      - tests/resumable-event-locals.test.ts
      - .github/workflows/resumable-event-locals-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-resume-authority
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/patch-resumable-event-locals.mjs
      - run: npm run typecheck
      - run: npx vitest run tests/resumable-event-locals.test.ts tests/runtime-performance-regressions.test.ts tests/server-i18n-setup-context.test.ts
      - run: |
          rm scripts/patch-resumable-event-locals.mjs
          rm .github/workflows/resumable-event-locals-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/compiler/index.ts src/runtime/index.ts tests/resumable-event-locals.test.ts scripts/patch-resumable-event-locals.mjs .github/workflows/resumable-event-locals-fix.yml
          git commit -m "fix(runtime): resume inline handlers with template locals"
          git push origin HEAD:fix/i18n-resume-authority
