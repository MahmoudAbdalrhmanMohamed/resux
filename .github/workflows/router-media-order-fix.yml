name: Apply router media guard ordering fix

on:
  push:
    branches:
      - agent/i18n-router-runtime-hardening
    paths:
      - scripts/patch-router-media-order.mjs
      - .github/workflows/router-media-order-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/patch-router-media-order.mjs
      - run: |
          rm scripts/patch-router-media-order.mjs
          rm .github/workflows/router-media-order-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts scripts/patch-router-media-order.mjs .github/workflows/router-media-order-fix.yml
          git commit -m "fix(router): preserve managed media link guards"
          git push origin HEAD:agent/i18n-router-runtime-hardening
