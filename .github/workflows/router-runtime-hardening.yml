name: Apply router runtime hardening

on:
  push:
    branches:
      - agent/i18n-router-runtime-hardening
    paths:
      - scripts/patch-router-runtime-hardening.mjs
      - .github/workflows/router-runtime-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-router-runtime-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply runtime patch
        run: node scripts/patch-router-runtime-hardening.mjs
      - name: Remove temporary patch machinery
        run: |
          rm scripts/patch-router-runtime-hardening.mjs
          rm .github/workflows/router-runtime-hardening.yml
      - name: Commit framework fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts tests/runtime-performance-regressions.test.ts scripts/patch-router-runtime-hardening.mjs .github/workflows/router-runtime-hardening.yml
          git commit -m "fix(router): harden route payload loading"
          git push origin HEAD:agent/i18n-router-runtime-hardening
