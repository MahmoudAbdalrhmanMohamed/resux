name: Apply server i18n context fix

on:
  push:
    branches: [fix/i18n-resume-authority]
    paths:
      - scripts/patch-server-i18n-context.mjs
      - .github/workflows/server-i18n-context-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-resume-authority
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/patch-server-i18n-context.mjs
      - run: npm run typecheck
      - run: npx vitest run tests/server-i18n-setup-context.test.ts tests/runtime-performance-regressions.test.ts tests/i18n.test.ts
      - run: |
          rm scripts/patch-server-i18n-context.mjs
          rm .github/workflows/server-i18n-context-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/index.ts tests/server-i18n-setup-context.test.ts scripts/patch-server-i18n-context.mjs .github/workflows/server-i18n-context-fix.yml
          git commit -m "fix(i18n): use request-local server translation context"
          git push origin HEAD:fix/i18n-resume-authority
