name: Apply icon Sonar fixes

on:
  push:
    branches:
      - audit/full-history-correctness

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Apply icon fixes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/icons/index.ts")
          text = path.read_text(encoding="utf8")

          old = r'''export function normalizeIconApiProvider(value: unknown): string {
            const raw = typeof value === "string" ? value.trim().replace(/\/+$/g, "") : "";
          '''
          new = r'''function stripTrailingSlashes(value: string): string {
            let end = value.length;
            while (end > 0 && value.charCodeAt(end - 1) === 47) {
              end -= 1;
            }
            return value.slice(0, end);
          }

          export function normalizeIconApiProvider(value: unknown): string {
            const raw = typeof value === "string" ? stripTrailingSlashes(value.trim()) : "";
          '''
          if old not in text:
              raise SystemExit("provider normalization target not found")
          text = text.replace(old, new, 1)

          old = 'return url.toString().replace(/\\/+$/g, "");'
          if old not in text:
              raise SystemExit("URL normalization target not found")
          text = text.replace(old, 'return stripTrailingSlashes(url.toString());', 1)

          old = r'''function readSvgAttribute(source: string, name: string): string {
            const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = new RegExp(
              "\\b" + escapedName + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)')",
              "i",
            ).exec(source);
            return (match?.[1] ?? match?.[2] ?? "").trim();
          }
          '''
          new = r'''function readSvgAttribute(source: string, name: string): string {
            const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, String.raw`\$&`);
            const match = new RegExp(
              String.raw`\b${escapedName}\s*=\s*(?:"([^"]*)"|'([^']*)')`,
              "i",
            ).exec(source);
            return (match?.[1] ?? match?.[2] ?? "").trim();
          }
          '''
          if old not in text:
              raise SystemExit("SVG attribute target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf8")
          Path(".github/workflows/sonar-pr4-all-issues.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sonar): simplify icon parsing and provider normalization"
          git push origin HEAD:audit/full-history-correctness
