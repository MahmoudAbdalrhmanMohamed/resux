name: Sonar PR 60 diagnostic

on:
  push:
    branches:
      - chore/v1-release-hardening

permissions:
  contents: read

jobs:
  sonar-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query SonarQube Cloud issues for PR 60
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=MahmoudAbdalrhmanMohamed_resux' \
            --data-urlencode 'pullRequest=60' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'ps=100' \
            | jq -c '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, status, impacts}]}'
