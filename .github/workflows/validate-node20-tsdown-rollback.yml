name: Validate Node 20 tsdown rollback

on:
  push:
    branches:
      - fix/node20-tsdown-build-compat

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/node20-tsdown-build-compat

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install strictly
        run: npm ci --no-audit --no-fund

      - name: Build framework on Node 20.19
        run: npm run build

      - name: Run framework tests on Node 20.19
        run: npm test

      - name: Commit regenerated lock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-node20-tsdown-rollback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/validate-node20-tsdown-rollback.yml
          git commit -m "fix: lock Node 20 compatible build toolchain"
          git push origin HEAD:fix/node20-tsdown-build-compat
