name: Verify full history audit

on:
  push:
    branches:
      - audit/full-history-correctness

permissions:
  contents: write

concurrency:
  group: full-history-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-history-correctness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply generated source fixes and verify
        id: verify
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Apply generated browser reactivity fixes'
            node scripts/prepare-generated-reactivity-array-fix.mjs
            node scripts/apply-generated-reactivity-fixes.mjs
            echo '## Apply icon runtime fixes'
            node scripts/prepare-icon-runtime-fix.mjs
            node scripts/apply-icon-runtime-fixes.mjs
            node scripts/fix-icon-attribute-parser.mjs
            echo '## Apply module head merge fix'
            node scripts/apply-head-merge-fix.mjs
            echo '## Preserve font loader compatibility'
            node scripts/apply-font-loader-compat.mjs
            echo '## Apply README updates'
            node scripts/apply-readme-audit-updates.mjs
            echo '## Typecheck'
            npm run typecheck
            echo '## Full test suite'
            npm test
          } 2>&1 | tee full-history-audit-final.log

      - name: Commit verified source changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm full-history-audit-final.log
          rm scripts/prepare-generated-reactivity-array-fix.mjs
          rm scripts/apply-generated-reactivity-fixes.mjs
          rm scripts/prepare-icon-runtime-fix.mjs
          rm scripts/apply-icon-runtime-fixes.mjs
          rm scripts/fix-icon-attribute-parser.mjs
          rm scripts/apply-head-merge-fix.mjs
          rm scripts/apply-font-loader-compat.mjs
          rm scripts/apply-readme-audit-updates.mjs
          rm .github/workflows/verify-full-history-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete full-history correctness audit"
          git push origin HEAD:audit/full-history-correctness

      - name: Commit verification diagnostics
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp full-history-audit-final.log /tmp/full-history-audit-final.log
          git reset --hard HEAD
          cp /tmp/full-history-audit-final.log full-history-audit-final.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-history-audit-final.log
          git commit -m "test: record full-history audit failure"
          git push origin HEAD:audit/full-history-correctness
