# SonarCloud Automatic Analysis settings (read from the default branch).
# Exclude tests from the duplication (CPD) check. Test files repeat setup and
# fixtures on purpose, and moving or splitting a test file counts as new code,
# so the new-code duplication gate failed on pure moves (see PR #167).
# Issues and the other quality gate conditions still apply to tests.
sonar.cpd.exclusions=tests/**
